[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernyx-video-maker"
version = "0.1.0"
description = "Local pipeline for short-form vertical video generation"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=6.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
packages = ["core", "pipeline", "schemas", "storage"]
py-modules = ["job_paths", "scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
